name: CI

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The repository does not yet contain the Gradle Wrapper scripts/JAR.
      # Bootstrap Gradle 8.14.3, generate the wrapper, then use it for the build.
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.14.3

      - name: Build and test
        run: ./gradlew clean build
